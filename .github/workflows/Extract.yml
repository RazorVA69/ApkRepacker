name: Extract Zip

on:
  workflow_dispatch:
    inputs:
      commit_message:
        description: 'Commit message'
        required: false
        default: 'Extract zip contents'

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract zip
        run: |
          zip_file=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$zip_file" ]; then
            echo "No zip file found in repo root"
            exit 1
          fi
          unzip -o "$zip_file" -d .
          rm "$zip_file"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "${{ github.event.inputs.commit_message }}"
          git push
